[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eco_campus"
version = "1.0.0"
description = "Эко-логистика кампуса РУДН — интеллектуальная навигация к экопунктам"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "networkx>=3.3",
    "pydantic>=2.7",
    "qrcode[pil]>=7.4",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["eco_campus/tests"]
addopts = "-v --tb=short --cov=eco_campus --cov-report=term-missing"

[tool.setuptools.packages.find]
where = ["."]
